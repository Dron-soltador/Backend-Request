version: '3.8'

services:
  db-pedidos:
    image: postgres:15-alpine
    container_name: db-pedidos
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORT_DB_PEDIDOS}:5432"
    volumes:
      - vol_db_pedidos:/var/lib/postgresql/data
    networks:
      - red-logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-pedidos:
    build: .
    container_name: api-pedidos
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-pedidos:5432/${POSTGRES_DB}
      - JWT_SECRET=clave_secreta_super_segura
    depends_on:
      db-pedidos:
        condition: service_healthy
    networks:
      - red-logistica

networks:
  red-logistica:
    name: red-logistica
    external: true

volumes:
  vol_db_pedidos: